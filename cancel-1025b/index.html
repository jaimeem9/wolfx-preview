<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WolfX cancel flow prototype</title>

<!--
  Prototipo AISLADO del funnel de cancelacion VIP Monthly (2026-10-23).
  Sin pasarelas, sin CRM, sin Telegram, sin datos reales: todo sale de FIXTURES.
  Lo que en produccion manda el backend va marcado con data-k="<clave del contrato>".
  Tokens copiados de /plans-lp/ en vivo (23-10-2026): --ink, --gold, --gold-pill, --line...
-->
<style>
:root{
  /* Marca, medidos en /plans-lp/ (bloque .wolfx-lp) */
  --ink:#14161d; --ink-soft:#3a3f4c; --muted:#5d6472; --line:#e7e9ee;
  --gold:#c9a227; --gold-2:#e0bd4b; --gold-pill:linear-gradient(180deg,#e8c860 0%,#c9a227 100%);
  --gold-soft:#fffaef; --green:#15803d; --green-soft:#ecfdf3;
  /* Añadidos para este flujo: marfil y tinta dorada para texto pequeño (AA sobre blanco) */
  --ivory:#fbf8f1; --ivory-2:#f5efe0; --line-warm:#ece2c8; --gold-ink:#7a5c00;
  --red:#b42318; --red-soft:#fef3f2; --amber:#9a6700; --amber-soft:#fff8e6;
  --card:#ffffff; --radius:18px;
  --shadow:0 24px 64px rgba(20,22,40,.16),0 2px 8px rgba(20,22,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --proto-h:44px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--ivory);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.clean{--proto-h:0px}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}

/* ---------- Barra del prototipo (no es UI de producto) ---------- */
.proto{position:fixed;top:0;left:0;right:0;height:var(--proto-h);z-index:60;display:flex;align-items:center;gap:8px;padding:0 12px;background:#20232c;color:#f3f4f6;font-size:13px}
.proto b{color:#e8c860;font-weight:700;letter-spacing:.04em}
.proto .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.proto button{background:#343846;border:0;border-radius:8px;color:#fff;padding:6px 10px;min-height:32px;cursor:pointer}
body.clean .proto,body.clean .drawer{display:none}
.drawer{position:fixed;top:var(--proto-h);right:0;width:min(380px,100%);bottom:0;z-index:61;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.12);overflow:auto;padding:16px 16px 40px;font-size:14px;display:none}
.drawer.open{display:block}
.drawer h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.drawer label{display:block;margin:8px 0 2px;font-weight:600}
.drawer select{width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.drawer .jump{display:flex;flex-wrap:wrap;gap:6px}
.drawer .jump button{border:1px solid var(--line);background:var(--ivory);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px}
.drawer .log{font:12px/1.5 ui-monospace,Menlo,monospace;background:#f6f7f9;border-radius:8px;padding:8px;max-height:220px;overflow:auto;white-space:pre-wrap}

/* ---------- Fondo: My Account (simulado) ---------- */
.acct{padding:calc(var(--proto-h) + 0px) 0 48px}
.acct-top{background:#fff;border-bottom:1px solid var(--line)}
.acct-top .in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:30px;width:auto;display:block}
.brand span{font-weight:800;letter-spacing:.12em;font-size:13px;color:var(--gold-ink)}
.acct main{max-width:1080px;margin:0 auto;padding:28px 20px}
.acct h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.acct .crumbs{color:var(--muted);font-size:14px;margin:0 0 20px}
.subcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px;grid-template-columns:1fr auto;align-items:center;box-shadow:0 2px 10px rgba(20,22,40,.05)}
.subcard .nm{font-weight:700;font-size:17px}
.subcard .meta{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.off{background:#f2f3f5;color:var(--ink-soft)}
.linkbtn{background:none;border:0;padding:10px 4px;min-height:44px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.banner-f{margin-top:16px;border:1px solid var(--line-warm);background:linear-gradient(90deg,var(--gold-soft),#fff);border-radius:var(--radius);padding:18px 20px;display:grid;gap:12px;grid-template-columns:1fr auto;align-items:center}
.banner-f p{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;z-index:70;max-width:calc(100% - 32px)}
@media (max-width:600px){.subcard,.banner-f{grid-template-columns:1fr}}

/* ---------- Modal (patron Ubersuggest: tarjeta centrada, pie fijo con Keep plan / Continue cancellation) ---------- */
.scrim{position:fixed;inset:var(--proto-h) 0 0 0;z-index:40;background:rgba(20,22,29,.48);display:none;overflow:auto;padding:20px}
.scrim.open{display:flex}
.dlg{position:relative;margin:auto;width:100%;max-width:580px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100dvh - var(--proto-h) - 40px)}
.dlg.wide{max-width:620px}
#view,#view>.fade{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.dlg-head{position:absolute;top:12px;right:12px;z-index:2;display:flex;align-items:center}
.dlg-scroll{padding-top:24px!important}
.dlg h2{padding-right:40px}
.hd-left{display:none}
.x{width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink-soft);flex:none}
.x:hover{background:#f3f4f6}
.dlg-scroll{overflow:auto;min-height:0;flex:1 1 auto;padding:2px 28px 22px}
.dlg-foot{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 20px 14px 22px;border-top:1px solid var(--line);background:#fff}
.dlg-foot .lft{margin-right:auto}
.lft-link{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 6px;border:0;background:none;color:var(--ink-soft);font-size:15px;text-decoration:none;cursor:pointer;border-radius:8px}
.lft-link:hover{color:var(--ink)}
.lft-link,.brand span{white-space:nowrap}
.lft-link .short{display:none}
@media (max-width:600px){.hd-left .lft-link .long{display:none}.hd-left .lft-link .short{display:inline}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);margin:10px 0 6px}
.dlg h2{font-size:25px;line-height:1.18;letter-spacing:-.02em;margin:4px 0 6px;font-weight:800}
.lead{color:var(--ink-soft);margin:0 0 16px;font-size:15.5px;line-height:1.45}
.lead strong{color:var(--ink)}

/* Botones: radio contenido (no pastilla), un primario por pantalla */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;min-height:46px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;border:0;white-space:nowrap;transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease}
.btn:active{transform:scale(.985)}
.btn-gold{background:var(--gold-pill);color:var(--ink);box-shadow:0 6px 16px rgba(201,162,39,.30),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-gold:hover{box-shadow:0 8px 22px rgba(201,162,39,.40),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-big{min-height:56px;font-size:17px;width:100%;border-radius:10px}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid #d6d9e0}
.btn-line:hover{border-color:var(--ink-soft)}
.btn[disabled]{cursor:not-allowed;background:#eceef2;color:#6b7280;box-shadow:none;border:0}
.btn .spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbtn.decline{display:block;margin:4px auto 0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

@media (max-width:600px){
  .scrim{padding:12px}
  .dlg,.dlg.wide{max-height:calc(100dvh - var(--proto-h) - 24px);border-radius:16px}
  .dlg-head{position:static;display:flex;justify-content:space-between;padding:6px 6px 0 8px;flex:none}
  .dlg-head .x{margin-left:auto}
  .dlg-scroll{padding-top:0!important}
  .hd-left:not(:empty){display:flex}
  .dlg-scroll{padding:0 16px 14px}
  .dlg-foot{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:12px 14px}
  .dlg-foot .lft{display:none}
  .dlg-foot.one{grid-template-columns:1fr}
  .dlg-foot .btn{padding:10px 14px;font-size:14.5px;white-space:normal;line-height:1.2;text-align:center;min-width:0}
  .dlg-foot{grid-template-columns:auto minmax(0,1fr)}
  .dlg h2{font-size:21px;margin-top:2px}
  .lead{font-size:14.5px;margin-bottom:12px}
}

/* Banda de precio futuro: sutil, no tarjeta */
.band{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:9px 12px;background:var(--ivory);border-radius:10px;font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.band svg{flex:none;margin-top:1px;color:var(--gold-ink)}

/* Pantalla 1: cuadricula 2x2 como Ubersuggest */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{border:1px solid var(--line-warm);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.vcard .lbl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-ink);line-height:1.2}
.vcard .lbl svg{flex:none;width:17px;height:17px}
.vcard p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.4}
.vcard a{display:inline-flex;align-items:center;min-height:44px;margin:auto 0 -10px;align-self:flex-start;font-size:14px;font-weight:600;color:var(--ink);text-underline-offset:3px}
@media (max-width:600px){
  .vgrid{gap:8px}
  .vcard{padding:11px 11px 10px;gap:4px;border-radius:12px}
  .vcard .lbl{font-size:11px;letter-spacing:.05em}
  .vcard p{font-size:13px;line-height:1.35}
  .vcard a{font-size:13px}
}

/* ---------- Pantalla 1 (opcion A, 24-10): icono de la pagina de planes + titulo en la misma linea ---------- */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.bcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;min-width:0;overflow-wrap:anywhere;
  border:1px solid #efe3c2;background:linear-gradient(180deg,#fffdf6 0%,#fff 60%);
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(122,92,0,.06),0 8px 20px -10px rgba(122,92,0,.22)}
.bhead{display:flex;align-items:center;gap:10px}
.bcard h3{margin:0;font-size:15.5px;line-height:1.2;letter-spacing:-.01em}
.bcard p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-soft)}
.bcard a{display:inline-flex;align-items:center;min-height:44px;white-space:nowrap;overflow-wrap:normal;width:max-content;max-width:none;margin:-8px 0 -12px;font-size:13.5px;font-weight:600;color:var(--ink);text-underline-offset:3px}
.pic{flex:none;display:grid;place-items:center;width:24px;height:24px;color:var(--ink)}
.pic svg{width:22px;height:22px}
.pic.sm{width:20px;height:20px}
.pic.sm svg{width:17px;height:17px}
.du{display:none}
.v1 .band{margin-top:12px}
@media (max-width:600px){
  .bgrid{gap:8px}
  .bcard{padding:10px;gap:6px;border-radius:12px}
  .bhead{gap:7px}
  .bcard h3{font-size:13.5px}
  .bcard p,.bcard a{font-size:12.5px;line-height:1.38}
  .bcard a{margin:-10px 0 -12px}
  .pic{width:20px;height:20px}
  .pic svg{width:19px;height:19px}
  .v1 .band{margin-top:8px;padding:6px 10px;font-size:12.5px}
}
@media (max-width:370px){.bcard h3{font-size:12.5px}.bhead{gap:6px}}

/* Pantalla 2: motivos en tarjeta con icono, radio nativo oculto pero accesible */
fieldset{border:0;margin:0;padding:0}
legend{padding:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:border-color .15s,background-color .15s}
.opt:hover{border-color:#cfd3db}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt .tile{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--gold-soft);color:var(--gold-ink);transition:background-color .15s}
.opt b{font-size:15.5px;font-weight:650;line-height:1.25}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.opt:has(input:checked) .tile{background:var(--gold-pill);color:var(--ink)}
.opt:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
.help{margin:10px 2px 0;font-size:14px;color:var(--ink-soft);min-height:21px}
.help a{font-weight:600;color:var(--ink);text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px}
.field{margin-top:12px}
.field label{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
.field label span{font-weight:400;color:var(--muted)}
textarea{width:100%;height:68px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;font-size:16px;line-height:1.4}
textarea:focus-visible{border-color:var(--ink);outline:3px solid var(--ink);outline-offset:2px}
#sub:not(:empty){margin-top:14px}
.subq legend,.subq>label{display:block;font-weight:700;font-size:15px;margin:0 0 8px;padding:0}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14.5px;line-height:1.3;background:#fff}
.sub input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:2px solid #9aa0ab;border-radius:50%;display:grid;place-items:center;background:#fff;cursor:pointer}
.sub input:checked{border-color:var(--gold)}
.sub input:checked::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.sub input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sub:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.subq.field{position:relative;margin-top:0}
.subq textarea{height:64px;resize:none}
.count{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--muted)}
#sub .help{margin-top:8px;min-height:0}
@media (max-width:600px){
  .opts{grid-template-columns:1fr 1fr;gap:8px}
  .opt{min-height:54px;padding:8px 10px;gap:9px}
  .opt b{font-size:14px;line-height:1.2}
  #sub:not(:empty){margin-top:10px}
  .subq legend,.subq>label{font-size:14px;margin-bottom:6px}
  .subs{grid-template-columns:1fr;gap:6px}
  .sub{min-height:44px;padding:6px 10px;font-size:13.5px;gap:9px}
  .subq textarea{height:60px}
  #sub .help{margin:0 0 -8px}
  .opt{min-height:50px}
  .opt .tile{width:30px;height:30px;border-radius:8px}
  .opt .tile svg{width:18px;height:18px}
  .help{font-size:13.5px}
}

/* Pantalla 3: confirmar las tres, como Ubersuggest (Continue bloqueado hasta marcarlas) */
.warn-h{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.warn-h .wi{width:40px;height:40px;display:grid;place-items:center;color:#b54708;margin-top:2px}
.acks{display:grid;gap:2px;margin-left:54px}
.ack{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:9px 0;cursor:pointer;font-size:15.5px;line-height:1.45;color:var(--ink)}
.ack input,.consent input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid #8f96a3;border-radius:7px;background:#fff;display:grid;place-items:center;cursor:pointer}
.ack input{margin-top:1px;border-radius:6px}
.ack input:checked{background:var(--gold);border-color:var(--gold)}
.ack input:checked::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.consent input:checked{background:var(--ink);border-color:var(--ink)}
.consent input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ack input:focus-visible,.consent input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.need{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:9px 12px;border-radius:10px;background:var(--amber-soft);border:1px solid #f0d58a;color:#6b4e00;font-size:14.5px;font-weight:700}
.need svg{flex:none;color:#9a6700}
@media (max-width:600px){
  .warn-h{grid-template-columns:30px 1fr;gap:10px}
  .warn-h .wi{width:30px;height:30px;margin-top:0}
  .warn-h .wi svg{width:26px;height:26px}
  .acks{margin-left:0}
  .ack{font-size:14.5px;line-height:1.4;padding:8px 0}
}

/* Pantalla 4: oferta tipo Ubersuggest. El CTA del $99 es el unico con degradado y brillo */
.offer{border:1px solid var(--line-warm);border-radius:18px;padding:20px 22px;background:linear-gradient(180deg,var(--gold-soft) 0%,#fff 46%)}
.offer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.offer-h{margin:0;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.ttl-top{margin:0 0 12px!important}
.timer{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line-warm);border-radius:999px;padding:4px 11px;white-space:nowrap}
.timer.low{color:var(--red);border-color:#f3c4bf}
.prod{font-size:15px;font-weight:700;color:var(--gold-ink);margin:2px 0 0}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 0 2px}
.price .big{font-size:60px;line-height:1;font-weight:800;letter-spacing:-.035em}
.price s{color:var(--muted);font-size:20px}
.save{font-size:13px;font-weight:800;color:var(--gold-ink);background:#fff3cf;border-radius:999px;padding:3px 10px}
.once{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px}
.feat{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.feat li{display:grid;grid-template-columns:18px 1fr;gap:9px;font-size:14.5px;line-height:1.4;color:var(--ink-soft)}
.feat svg{color:var(--green);margin-top:2px}
.fine{font-size:12.5px;color:var(--muted);margin:10px 2px 0;line-height:1.4}
.swap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-size:14px}
.swap b{font-weight:700}
.swap .from{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:#b8bcc6}
.swap .arr{display:grid;place-items:center;color:var(--muted)}
.swap .arr svg{width:16px;height:16px}
.consent{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line-warm);background:#fff;font-size:14px;line-height:1.4;color:var(--ink);cursor:pointer;margin:0 0 12px}
.consent:has(input:checked){border-color:var(--ink)}
.expired{border:1px dashed #cfd3db;border-radius:12px;padding:12px;text-align:center;color:var(--ink-soft);font-size:15px;margin:0}
@media (max-width:600px){
  .offer{padding:14px 16px;border-radius:14px}
  .offer-top{margin-bottom:2px}
  .offer-h{font-size:20px}
  .ttl-top{margin-bottom:8px!important}
  .timer{font-size:12.5px;padding:3px 9px}

  .prod{font-size:14px}
  .price{margin:8px 0 0;gap:10px}
  .price .big{font-size:50px}
  .price s{font-size:17px}
  .once{font-size:11.5px;margin-bottom:10px}
  .feat{margin-top:10px;gap:4px}
  .feat li{font-size:13.5px;line-height:1.35}
  .fine{font-size:12px;margin-top:8px}
  .btn-big{min-height:52px;font-size:16.5px}
  .swap{display:none}
  .consent{padding:10px 12px;font-size:13px;gap:10px;margin-bottom:10px}
}

/* Pie: el avance va en dorado plano para no competir con el CTA del $99 */
.dlg-foot .btn-gold{background:var(--gold);box-shadow:none}
.dlg-foot .btn-gold:hover{background:#b8931f;box-shadow:none}
.dlg-foot .btn-gold[disabled]{background:#eceef2}

/* Pantalla 5: comparativa */
.done-strip{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--green-soft);color:#14532d;font-size:13.5px;margin:2px 0 12px;line-height:1.35}
.done-strip svg{flex:none;color:var(--green)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.col{border-radius:14px;padding:14px;border:1px solid var(--line)}
.col.pt{border:1.5px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),#fff 60%)}
.col h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.col.pt h3{color:var(--gold-ink)}
.col.std h3{color:var(--muted)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.col li{display:grid;grid-template-columns:17px 1fr;gap:7px;font-size:14px;line-height:1.35}
.col li svg{margin-top:1px}
.ok-i{color:var(--green)} .no-i{color:var(--red)} .neu-i{color:#9aa0ab}
@media (max-width:600px){
  .cmp{gap:6px;margin:6px 0 10px}
  .col{padding:10px 9px;border-radius:12px}
  .col ul{gap:5px}
  .col li{font-size:12.5px;grid-template-columns:15px 1fr;gap:5px;line-height:1.3}
  .col li svg{width:15px;height:15px}
  .done-strip{font-size:12.5px;padding:7px 10px;margin-bottom:8px}
}

/* Estados finales */
.res{text-align:center;padding-top:6px}
.res .big-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:8px auto 14px}
.big-ic.ok{background:var(--green-soft);color:var(--green)}
.big-ic.wait{background:var(--amber-soft);color:var(--amber)}
.big-ic.err{background:var(--red-soft);color:var(--red)}
.big-ic.info{background:var(--ivory-2);color:var(--gold-ink)}
.res .lead{margin-bottom:16px}
.facts{text-align:left;margin:0 0 4px;padding:6px 16px;border-radius:14px;background:var(--ivory)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-warm);font-size:14.5px}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--ink-soft)}
.facts dd{margin:0;font-weight:700;text-align:right}
.loading{display:grid;place-items:center;gap:14px;padding:48px 0 40px;text-align:center;color:var(--ink-soft)}
.loading .spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}

/* Simulador de checkout: NO es diseño, va rayado a proposito */
.sim{border:2px dashed #9aa0ab;border-radius:16px;padding:18px;background:repeating-linear-gradient(135deg,#fafafa 0 12px,#f2f3f5 12px 24px)}
.sim h3{margin:0 0 6px;font-size:15px}
.sim p{margin:0 0 12px;font-size:14px;color:var(--ink-soft)}
.sim .btns{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:600px){.sim{padding:12px}.sim p{font-size:13px;margin-bottom:8px}.sim .btns{gap:6px}.sim button{font-size:13px;padding:6px 8px}}
.sim button{min-height:44px;border-radius:10px;border:1px solid #cfd3db;background:#fff;cursor:pointer;text-align:left;padding:8px 12px;font-size:14px}
.blocked{border:2px dashed var(--red);border-radius:16px;padding:18px;background:var(--red-soft);color:#7a1a12;font-size:14.5px}
.blocked b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}

/* Notas de contrato para Roberto (solo con «Notes» activado) */
.k,.trial .k,.swap .k,.facts .k{display:none!important}
body.notes .k{display:inline-block!important;font:600 10.5px/1.4 ui-monospace,Menlo,monospace;color:#6b4e00;background:#fff3cf;border:1px solid #e8c860;border-radius:6px;padding:0 5px;margin:0 4px;vertical-align:middle;letter-spacing:0;text-transform:none}

/* Modo captura: solo la etiqueta del viewport; el dialogo tiene que caber sin scroll */
body.cap{--proto-h:22px}
body.cap .vp{display:flex}
.vp{display:none;position:fixed;top:0;left:0;right:0;height:22px;align-items:center;justify-content:center;z-index:90;font:600 11px/1 -apple-system,sans-serif;background:#2b2e38;color:#fff;letter-spacing:.02em;pointer-events:none}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn,.opt{transition:none}.spin,.loading .spin{animation-duration:2.4s}}
/* Pantalla 1, opcion 2: "VIP signals + everything below" */
.plus{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:14px}
.plus-base{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--gold-soft);border:1px solid #efe3c2}
.plus-base b{font-size:14px}
.plus-op{font-weight:800;color:var(--gold-ink);font-size:18px}
.plus-more{color:var(--ink-soft);font-weight:600}

/* Pantalla 3: tarjeta = casilla + titulo y descripcion, sin iconos. r1 casilla a la izquierda, r2 a la derecha */
.acks{gap:8px}
.acks .ack{grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:border-color .15s,background-color .15s}
.acks .ack:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.r2 .ack{grid-template-columns:1fr 24px}
.r2 .ack input{order:3}
.atx b{display:block;font-size:15.5px;line-height:1.3}
.atx>span{display:block;font-size:14px;line-height:1.4;color:var(--ink-soft);margin-top:2px}
u.stop{font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:3px}
/* Pantalla 1, titulo: "signals" destacado. em1 marcador, em2 subrayado recto (elegido 25-10), em3 etiqueta */
.em{white-space:nowrap}
.em1{background:linear-gradient(180deg,transparent 60%,rgba(232,200,96,.6) 60%,rgba(232,200,96,.6) 92%,transparent 92%);padding:0 2px}
.em2{position:relative;display:inline-block}
.em2::after{content:"";position:absolute;left:0;right:0;bottom:-.08em;height:.12em;min-height:3px;border-radius:2px;background:var(--gold)}
.em3{display:inline-block;padding:0 .28em .04em;border-radius:.22em;background:var(--ink);color:#f1d27a;transform:rotate(-1.5deg)}
/* Oferta: el CTA de $99 respira y lleva un destello cada pocos segundos */
.btn-cta{position:relative;overflow:hidden;isolation:isolate;box-shadow:0 8px 22px rgba(201,162,39,.45),0 0 0 3px rgba(232,200,96,.25),inset 0 1px 0 rgba(255,255,255,.5);animation:ctaNudge 3.2s ease-in-out infinite}
.btn-cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:ctaShine 3.2s ease-in-out infinite}
.btn-cta[disabled]{animation:none}.btn-cta[disabled]::after{display:none}
@keyframes ctaNudge{0%,62%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(-2px) scale(1.02)}78%{transform:translateY(0) scale(1)}84%{transform:translateY(-1px) scale(1.01)}90%{transform:none}}
@keyframes ctaShine{0%,55%{left:-60%}80%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){.btn-cta,.btn-cta::after{animation:none}.btn-cta::after{display:none}}
@media (max-width:600px){
  .acks .ack{gap:9px}
  .atx b{font-size:14.5px}
  .atx>span{font-size:13px;line-height:1.35}
  .acks{gap:6px}
  .acks .ack{padding:9px 10px}
  .plus{margin:-2px 0 8px;font-size:13px}
  .plus-base b{font-size:13px}
}
/* 360 px: la oferta tiene que caber sin scroll */
@media (max-width:370px){.acks{gap:5px}.atx b{font-size:13.5px}.acks .ack{gap:8px}.need{padding:7px 10px;font-size:13.5px}.acks .ack{padding:6px 9px}.atx>span{font-size:12.5px}.price .big{font-size:44px}.offer-h{font-size:18px}.offer{padding-top:12px;padding-bottom:12px}.price{margin-top:6px}}
@media (max-width:370px){.bcard a{font-size:12px}}
</style>
</head>

var MEM={};
function offerExpiresAt(){
  var key='wx_offer_expires_'+S.plan, v=MEM[key]||null;
  try{ v = sessionStorage.getItem(key) || v; }catch(e){}
  if (!v){
    v = String(Date.now() + 15*60*1000); MEM[key]=v;
    try{ sessionStorage.setItem(key, v); }catch(e){}
    ev('offer_viewed',{offer:'lifetime_99', expires_at:new Date(+v).toISOString()});
  }
  return +v;
}
function remaining(){
  if (S.timer==='expired') return 0;
  if (S.timer==='low') return 47*1000;

}

/* ===================== NAVEGACION ===================== */
var scrim=document.getElementById('scrim'), view=document.getElementById('view'), dlg=document.getElementById('dlg');
var lastFocus=null, tick=null, navId=0;
/* Las esperas simuladas solo actuan si nadie ha navegado (cerrar, Esc) mientras tanto */
function later(fn, ms){ var my=navId; setTimeout(function(){ if (my===navId) fn(); }, ms); }
function show(screen, opts){
  opts=opts||{}; navId++;
  if (!opts.noHist && S.screen && S.screen!=='account' && S.screen!==screen) S.hist.push(S.screen);
  if (screen!==S.screen) S.busy=false;
  S.screen=screen;
  if (screen==='account'){ scrim.classList.remove('open'); view.innerHTML=''; clearInterval(tick); renderAcct(); sync(); var op=document.querySelector('[data-act="open"]'); if(op) op.focus(); return; }
  if (!scrim.classList.contains('open')){ lastFocus=document.activeElement; scrim.classList.add('open'); }
  var html;
  if (screen==='loading-cancel') html=V.loading('Cancelling your renewal…');
  else if (screen==='loading-sync') html=V.Bsync();
  else html=(V[screen]||V.value)();
  view.innerHTML='<div class="fade">'+html+'</div>';
  /* En movil el enlace de la izquierda del pie (Back / Contact support) va en la cabecera */
  var lft=view.querySelector('.dlg-foot .lft'), hl=document.getElementById('hdLeft'); hl.innerHTML='';
  if (lft) hl.appendChild(lft.firstElementChild.cloneNode(true));
  dlg.classList.toggle('wide', screen==='offer'||screen==='platinum');
  scrim.scrollTop=0; var sc=view.querySelector('.dlg-scroll'); if(sc) sc.scrollTop=0;
  document.getElementById('closeBtn').setAttribute('aria-label', S.done?'Close':'Close and keep my subscription');
  var t=view.querySelector('#dlgTitle'); if (t && !opts.keepFocus) t.focus({preventScroll:true});
  clearInterval(tick);
  if (screen==='offer' || screen==='C') tick=setInterval(updTimer, 1000);
  sync();
}
function updTimer(){
  var el=document.getElementById('tmr'); var ms=remaining();
  if (ms<=0 && S.screen==='C' && view.querySelector('[data-act="buy"]')){ ev('offer_expired'); rerender(); clearInterval(tick); return; }
  if (!el) return;
  if (ms<=0){ ev('offer_expired'); show(S.screen,{noHist:true,keepFocus:true}); clearInterval(tick); return; }
  el.textContent=mmss(ms);
}
function back(){ var prev=S.hist.pop(); show(prev||'value',{noHist:true}); }
function rerender(){ show(S.screen,{noHist:true,keepFocus:true}); }

function decline(){
  ev('offer_declined'); show('loading-cancel');
  later(function(){
    if (S.cancel==='error'){ ev('cancellation_failed'); show('cancelErr'); return; }
    ev('cancellation_confirmed',{paid_through:PAID_THROUGH}); S.acct='cancelled'; S.done=true;
    var pt=P().pt;
    if (S.reason==='poor' && S.pt==='eligible'){ ev('platinum_offer_viewed'); show('platinum'); }
    else show('A');
  }, 1100);
}

document.addEventListener('click', function(e){
  var a=e.target.closest('[data-act],[data-sim],[data-ev]'); if(!a) return;
  if (a.dataset.ev) ev(a.dataset.ev, a.dataset.ev==='help_link_clicked'?{reason:S.reason}:null);
  var act=a.dataset.act, sim=a.dataset.sim;
  if (act==='open'){
    ev('cancel_flow_opened',{plan:S.plan,status:S.status});
    show(S.status==='active'?'value':'out');
  }
  else if (act==='keep'){ ev('keep_clicked',{screen:S.screen}); S.hist=[]; show('account'); if(!S.done) toast('No changes made. Your subscription stays active.'); }
  else if (act==='close'){ ev('flow_closed',{screen:S.screen}); S.hist=[]; show('account'); }
  else if (act==='go') show(a.dataset.to);
  else if (act==='back') back();
  else if (act==='reasonNext'){ if(!reasonDone()) return; ev('reason_continue',{reason:S.reason, sub_reason:S.sub, detail_chars:S.reason==='other'?S.why.trim().length:0}); show(S.reason==='price'?'offer':'review'); }
  else if (act==='buy'){
    if (S.busy) return;
    if (remaining()<=0){ rerender(); return; }
    ev('offer_accept_clicked'); S.busy=true; rerender();
    later(function(){ ev('checkout_opened',{product:P().lifetime,price:99}); show('checkout'); }, 900);
  }
  else if (act==='decline') decline();
  else if (act==='toA') show('A');
  else if (act==='trial'){ ev('platinum_trial_clicked'); show('trialCheckout'); }
  if ((sim==='paid'||sim==='3ds') && remaining()<=0){ ev('order_rejected_offer_expired'); S.hist.pop(); show('offer',{noHist:true}); }
  else if (sim==='paid'||sim==='3ds'){ ev(sim==='3ds'?'payment_3ds_passed':'payment_confirmed'); S.done=true; show('loading-sync'); later(function(){ ev('lifetime_entitlements_synced'); S.acct='lifetime'; show('B'); }, 1400); }
  else if (sim==='failed'){ ev('payment_failed'); show('C'); }
  else if (sim==='crypto'){ ev('payment_pending_crypto'); show('Cpending'); }
  else if (sim==='closed'){ ev('checkout_closed'); S.hist.pop(); show('offer',{noHist:true}); }
  else if (sim==='late'){ ev('order_rejected_offer_expired'); S.timer='expired'; show('offer',{noHist:true}); }
  else if (sim==='trial_ok'){ ev('platinum_trial_started'); show('D'); }
  else if (sim==='trial_fail'){ ev('platinum_trial_abandoned'); show('E'); }
});
document.addEventListener('change', function(e){
  var t=e.target;
  if (t.name==='reason'){
    /* Cambiar de motivo limpia el submotivo y el texto anteriores. Sin re-pintar: el foco no se mueve */
    if (S.reason!==t.value){ S.sub=null; S.why=''; }
    S.reason=t.value; ev('reason_selected',{reason:S.reason});
    document.getElementById('sub').innerHTML=subBlock();
    updReasonNext(); sync();
  }
  else if (t.name==='sub'){ S.sub=t.value; ev('sub_reason_selected',{reason:S.reason, sub_reason:S.sub}); updReasonNext(); sync(); }
  else if (t.dataset.ack){ S.acks[t.dataset.ack]=t.checked; ev('review_ack',{row:t.dataset.ack,checked:t.checked}); if(S.reqAcks){ rerender(); var c=view.querySelector('[data-ack="'+t.dataset.ack+'"]'); if(c) c.focus(); } }
  else if (t.id==='amAck'){ S.amAck=t.checked; ev('am_change_acknowledged',{checked:t.checked}); rerender(); document.getElementById('amAck').focus(); }
  else if (t.id==='ptConsent'){ S.consent=t.checked; ev('platinum_consent',{checked:t.checked}); rerender(); document.getElementById('ptConsent').focus(); }
});
var cTimer=null;
document.addEventListener('input', function(e){
  if (e.target.id!=='why') return;
  S.why=e.target.value; document.getElementById('whyCount').textContent=S.why.length+'/300'; updReasonNext();
  clearTimeout(cTimer);
  cTimer=setTimeout(function(){ ev('reason_detail_saved',{chars:S.why.length}); }, 700);
});
/* Escape = cerrar sin cambios; foco atrapado dentro del dialogo */
document.addEventListener('keydown', function(e){
  if (!scrim.classList.contains('open')) return;
  if (e.key==='Escape'){ ev('flow_closed',{screen:S.screen,via:'esc'}); S.hist=[]; show('account'); }
  if (e.key==='Tab'){
    var f=[].slice.call(dlg.querySelectorAll('a[href],button:not([disabled]),input,textarea,[tabindex="0"]')).filter(function(el){ return el.getClientRects().length>0; });
    if (!f.length) return; var first=f[0], last=f[f.length-1];
    if (e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
  }
});
document.getElementById('closeBtn').addEventListener('click', function(){ ev('flow_closed',{screen:S.screen,via:'x'}); S.hist=[]; var d=S.done; show('account'); if(!d) toast('No changes made. Your subscription stays active.'); });

function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();}, 3200); }

/* ===================== Controles del prototipo ===================== */
var CTRL={'c-plan':'plan','c-status':'status','c-disc':'disc','c-ct':'ct','c-extras':'extras','c-ref':'ref','c-acks':'reqAcks','c-pt':'pt','c-cancel':'cancel','c-timer':'timer'};
Object.keys(CTRL).forEach(function(id){
  var el=document.getElementById(id), key=CTRL[id];
  var v=S[key]; el.value = (typeof v==='boolean') ? (v?'1':'0') : v;
  el.addEventListener('change', function(){
    S[key] = (key==='disc'||key==='ref'||key==='reqAcks') ? el.value==='1' : el.value;
    if (key==='timer' && el.value==='fresh'){ try{ sessionStorage.removeItem('wx_offer_expires_'+S.plan); }catch(e){} }
    if (S.screen==='account') renderAcct(); else rerender();
  });
});
var JUMPS=[['account','My Account'],['value','1 Value'],['reason','2 Reason'],['review','3 Review'],['offer','4 Offer $99'],['checkout','Checkout sim'],['platinum','5 Platinum'],['A','A Cancelled'],['loading-sync','B Activating'],['B','B Lifetime'],['C','C Failed'],['Cpending','C Crypto pending'],['D','D Trial active'],['E','E No trial'],['cancelErr','Cancel error'],['out','Out of scope']];
document.getElementById('jump').innerHTML=JUMPS.map(function(j){return '<button type="button" data-jump="'+j[0]+'">'+j[1]+'</button>';}).join('');
document.getElementById('jump').addEventListener('click', function(e){ var b=e.target.closest('[data-jump]'); if(!b) return; S.hist=[]; show(b.dataset.jump,{noHist:true}); });
var drawer=document.getElementById('drawer'), dBtn=document.getElementById('drawerBtn');
dBtn.addEventListener('click', function(){ var o=drawer.classList.toggle('open'); dBtn.setAttribute('aria-expanded',o); });
var nBtn=document.getElementById('notesBtn');
nBtn.setAttribute('aria-pressed', document.body.classList.contains('notes'));
nBtn.addEventListener('click', function(){ var o=document.body.classList.toggle('notes'); nBtn.setAttribute('aria-pressed',o); });
function sync(){
  var r=REASONS.filter(function(x){return x.id===S.reason;})[0];
  document.getElementById('sum').textContent = P().monthly+' | '+(r?r.t:'no reason')+' | screen: '+S.screen;
  var u=new URLSearchParams(location.search); u.set('s',S.screen); u.set('plan',S.plan); if(S.reason) u.set('reason',S.reason); else u.delete('reason'); if(S.sub) u.set('sub',S.sub); else u.delete('sub'); u.delete('why'); u.delete('comment'); u.set('l',S.l1); u.set('h',S.h1); u.set('r',S.r3);
  history.replaceState(null,'','?'+u.toString());
}

/* Arranque: ?s=<pantalla> abre directamente esa vista (lo usan las capturas) */
renderAcct();
if (S.screen && S.screen!=='account') show(S.screen,{noHist:true}); else sync();
