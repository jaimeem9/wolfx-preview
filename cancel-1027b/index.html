<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WolfX thank you page</title>
<!--
  Prototipo AISLADO de la thank you page tras comprar el Lifetime $99 (2026-10-26).
  Tres variantes: ?v=1 | 2 | 3. Plan: ?plan=fg | am. Sin pagos ni datos reales.
  "Only on this page" solo es verdad si Roberto la muestra UNA vez por cliente: es requisito.
-->
<style>
:root{
  --ink:#14161d; --ink-soft:#3a3f4c; --muted:#5d6472; --line:#e7e9ee;
  --gold:#c9a227; --gold-2:#e0bd4b; --gold-pill:linear-gradient(180deg,#e8c860 0%,#c9a227 100%);
  --gold-soft:#fffaef; --gold-ink:#7a5c00; --line-warm:#ece2c8; --ivory:#fbf8f1; --ivory-2:#f5efe0;
  --green:#15803d; --green-soft:#ecfdf3;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--ivory);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.18em;font-size:13px;color:var(--gold-ink)}
.brand img{width:26px;height:auto}
.top .acct{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 56px}
.okline{display:flex;gap:10px;align-items:center;background:var(--green-soft);color:#14532d;border-radius:12px;padding:10px 14px;font-size:14.5px}
.okline svg{flex:none;color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;min-height:48px;padding:12px 20px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;border:0;text-align:center}
.btn-gold{background:var(--gold-pill);color:var(--ink);width:100%;min-height:60px;font-size:18px;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 10px 26px rgba(201,162,39,.45),0 0 0 3px rgba(232,200,96,.25),inset 0 1px 0 rgba(255,255,255,.5);animation:nudge 3.2s ease-in-out infinite}
.btn-gold::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes nudge{0%,62%,100%{transform:none}70%{transform:translateY(-2px) scale(1.02)}78%{transform:none}84%{transform:translateY(-1px) scale(1.01)}90%{transform:none}}
@keyframes shine{0%,55%{left:-60%}80%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){.btn-gold,.btn-gold::after{animation:none}.btn-gold::after{display:none}}
.skip{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-size:14.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 8px}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price .big{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.035em}
.price s{color:var(--muted);font-size:21px}
.save{font-size:13px;font-weight:800;color:var(--gold-ink);background:#fff3cf;border-radius:999px;padding:3px 10px}
.feat{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.feat li{display:grid;grid-template-columns:20px 1fr;gap:9px;font-size:15px;line-height:1.4;color:var(--ink-soft)}
.feat svg{color:var(--green);margin-top:2px}
.receipt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.receipt h2{margin:0 0 12px;font-size:17px}
.receipt dl{margin:0;display:grid;gap:10px}
.receipt dl div{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.receipt dl div:last-child{border:0;padding:0}
.receipt dt{color:var(--muted)} .receipt dd{margin:0;font-weight:700;text-align:right}
.fine{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}

/* ---------- V1: la oferta manda. Hero dorado a todo el ancho, confirmacion en una linea ---------- */
.v1 .hero{margin-top:18px;border-radius:24px;padding:34px 22px;background:radial-gradient(120% 90% at 50% 0%,#fff6d6 0%,#fffaef 45%,#fff 100%);border:1px solid var(--line-warm);box-shadow:0 30px 80px rgba(201,162,39,.18);text-align:center}
.v1 .eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);background:#fff;border:1px solid var(--line-warm);border-radius:999px;padding:6px 14px}
.v1 h1{font-size:44px;line-height:1.08;letter-spacing:-.03em;margin:18px auto 10px;max-width:640px}
.v1 h1 em{font-style:normal;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* Subrayado: 4 opciones (?u=1..4) */
.u1 h1 em{background:linear-gradient(var(--gold),var(--gold)) 0 100%/100% 3px no-repeat;padding-bottom:4px}
.u2 h1 em{background:linear-gradient(90deg,rgba(201,162,39,0),var(--gold) 18%,var(--gold-2) 50%,var(--gold) 82%,rgba(201,162,39,0)) 0 100%/100% 2px no-repeat;padding-bottom:6px}
.u3 h1 em{background:linear-gradient(180deg,#e8c860,#a8821a);-webkit-background-clip:text;background-clip:text;color:transparent}
.u4 h1 em{background:linear-gradient(var(--gold),var(--gold)) 0 calc(100% - 3px)/100% 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 100%/100% 1.5px no-repeat;padding-bottom:7px}
.v1 h1{margin-bottom:18px}
@media (max-width:380px){.v1 h1{font-size:28px}}
body:not(.clean){padding-bottom:60px}
.ubar{position:fixed;left:0;right:0;bottom:0;background:#14161d;display:flex;gap:6px;justify-content:center;padding:8px;z-index:9}
.ubar a{color:#fff;font-size:13px;padding:8px 12px;border-radius:8px;text-decoration:none;border:1px solid #3a3f4c}
.ubar a[aria-current]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
body.clean .ubar{display:none}
.v1 .sub{font-size:17px;color:var(--ink-soft);margin:0 auto;max-width:520px}
.v1 .deal{max-width:460px;margin:24px auto 0;text-align:left}
.v1 .deal .price{justify-content:center}
.v1 .deal .feat{max-width:360px;margin-left:auto;margin-right:auto}
.v1 .deal .btn-gold{margin-top:20px}
.v1 .receipt{max-width:560px;margin:26px auto 0}
.v1 .mrow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;margin:6px 0 12px}
.v1 .mk{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;border-radius:999px;padding:8px 14px;border:1.5px solid var(--line);background:#fff}
.v1 .mk.on{color:#14532d;background:var(--green-soft);border-color:#c9ecd6}
.v1 .mk.on svg{color:var(--green)}
.v1 .mk.add{border:2px solid var(--gold);background:linear-gradient(180deg,#fff3c4,#ffe8a3);color:var(--ink);box-shadow:0 6px 18px rgba(201,162,39,.35)}
.v1 .plus{font-weight:800;font-size:20px;color:var(--gold-ink)}
@media (max-width:600px){.v1 h1{font-size:31px}.v1 .mk{font-size:14px;padding:7px 11px}.v1 .hero{padding:24px 16px;border-radius:20px}.v1 .sub{font-size:15.5px}.price .big{font-size:54px}}

/* ---------- V2: recibo a la izquierda, cupon perforado a la derecha. Titular en serif ---------- */
.v2 h1{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.01em;margin:18px 0 6px}
.v2 .lead{color:var(--ink-soft);margin:0 0 22px;font-size:17px}
.v2 .grid{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:start}
.v2 .next{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 22px;font-size:15px;color:var(--ink-soft)}
.v2 .next b{color:var(--ink)}
.v2 .coupon{position:relative;background:#fff;border:2px dashed var(--gold);border-radius:20px;padding:26px 24px 22px}
.v2 .coupon::before,.v2 .coupon::after{content:"";position:absolute;top:118px;width:26px;height:26px;border-radius:50%;background:var(--ivory);border:2px dashed var(--gold)}
.v2 .coupon::before{left:-15px;clip-path:inset(0 0 0 50%)} .v2 .coupon::after{right:-15px;clip-path:inset(0 50% 0 0)}
.v2 .stamp{position:absolute;top:-14px;right:18px;transform:rotate(4deg);background:var(--ink);color:#fff;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:8px;padding:6px 10px}
.v2 .coupon h2{font-family:var(--serif);font-size:27px;line-height:1.15;margin:0 0 4px}
.v2 .coupon .k{font-size:15px;color:var(--ink-soft);margin:0 0 20px}
.v2 .tear{border-top:2px dashed var(--line-warm);margin:0 -24px 18px}
.v2 .coupon .btn-gold{margin-top:18px}
@media (max-width:820px){.v2 .grid{grid-template-columns:1fr}.v2 .coupon{order:-1}}
@media (max-width:600px){.v2 h1{font-size:30px}.v2 .lead{font-size:15.5px}.v2 .coupon{padding:24px 18px 18px}.v2 .tear{margin:0 -18px 16px}.v2 .coupon h2{font-size:23px}}

/* ---------- V3: los tres mercados dibujados, Crypto bloqueado. Centrado y estrecho ---------- */
.v3 .col{max-width:620px;margin:0 auto}
.v3 h1{font-size:36px;line-height:1.12;letter-spacing:-.025em;margin:22px 0 8px;text-align:center}
.v3 .lead{text-align:center;color:var(--ink-soft);margin:0 0 22px}
.v3 .card{background:#fff;border-radius:24px;padding:26px 24px;box-shadow:0 1px 0 rgba(20,22,40,.04),0 20px 50px rgba(20,22,40,.10);border:1px solid var(--line)}
.v3 .mk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.v3 .m{border-radius:16px;padding:14px 10px;text-align:center;border:1.5px solid var(--line);background:#fff}
.v3 .m .ic{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.v3 .m b{display:block;font-size:15px}
.v3 .m span{font-size:12.5px;color:var(--green);font-weight:700}
.v3 .m.lock{border:2px solid var(--gold);background:linear-gradient(180deg,#fff7dc,#fff);box-shadow:0 10px 26px rgba(201,162,39,.22)}
.v3 .m.lock .ic{background:var(--ink);color:#f6dc8a}
.v3 .m.lock span{color:var(--gold-ink)}
.v3 .once{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border:1px solid var(--line-warm);border-radius:14px;padding:12px 14px;font-size:14.5px;color:var(--ink-soft);margin:18px 0 0}
.v3 .once svg{flex:none;color:var(--gold-ink);margin-top:2px}
.v3 .once b{color:var(--ink)}
.v3 .card .btn-gold{margin-top:18px}
.v3 .receipt{margin-top:22px}
@media (max-width:600px){.v3 h1{font-size:28px}.v3 .card{padding:20px 16px}.v3 .m{padding:12px 6px}.v3 .m b{font-size:14px}.v3 .m .ic{width:34px;height:34px}}
</style>
</head>
