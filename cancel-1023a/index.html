<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WolfX cancel flow prototype</title>
<!--
  Prototipo AISLADO del funnel de cancelacion VIP Monthly (2026-10-23).
  Sin pasarelas, sin CRM, sin Telegram, sin datos reales: todo sale de FIXTURES.
  Lo que en produccion manda el backend va marcado con data-k="<clave del contrato>".
  Tokens copiados de /plans-lp/ en vivo (23-10-2026): --ink, --gold, --gold-pill, --line...
-->
<style>
:root{
  /* Marca, medidos en /plans-lp/ (bloque .wolfx-lp) */
  --ink:#14161d; --ink-soft:#3a3f4c; --muted:#5d6472; --line:#e7e9ee;
  --gold:#c9a227; --gold-2:#e0bd4b; --gold-pill:linear-gradient(180deg,#e8c860 0%,#c9a227 100%);
  --gold-soft:#fffaef; --green:#15803d; --green-soft:#ecfdf3;
  /* Añadidos para este flujo: marfil y tinta dorada para texto pequeño (AA sobre blanco) */
  --ivory:#fbf8f1; --ivory-2:#f5efe0; --line-warm:#ece2c8; --gold-ink:#7a5c00;
  --red:#b42318; --red-soft:#fef3f2; --amber:#9a6700; --amber-soft:#fff8e6;
  --card:#ffffff; --radius:18px;
  --shadow:0 24px 64px rgba(20,22,40,.16),0 2px 8px rgba(20,22,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --proto-h:44px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--ivory);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.clean{--proto-h:0px}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}

/* ---------- Barra del prototipo (no es UI de producto) ---------- */
.proto{position:fixed;top:0;left:0;right:0;height:var(--proto-h);z-index:60;display:flex;align-items:center;gap:8px;padding:0 12px;background:#20232c;color:#f3f4f6;font-size:13px}
.proto b{color:#e8c860;font-weight:700;letter-spacing:.04em}
.proto .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.proto button{background:#343846;border:0;border-radius:8px;color:#fff;padding:6px 10px;min-height:32px;cursor:pointer}
body.clean .proto,body.clean .drawer{display:none}
.drawer{position:fixed;top:var(--proto-h);right:0;width:min(380px,100%);bottom:0;z-index:61;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.12);overflow:auto;padding:16px 16px 40px;font-size:14px;display:none}
.drawer.open{display:block}
.drawer h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.drawer label{display:block;margin:8px 0 2px;font-weight:600}
.drawer select{width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.drawer .jump{display:flex;flex-wrap:wrap;gap:6px}
.drawer .jump button{border:1px solid var(--line);background:var(--ivory);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px}
.drawer .log{font:12px/1.5 ui-monospace,Menlo,monospace;background:#f6f7f9;border-radius:8px;padding:8px;max-height:220px;overflow:auto;white-space:pre-wrap}

/* ---------- Fondo: My Account (simulado) ---------- */
.acct{padding:calc(var(--proto-h) + 0px) 0 48px}
.acct-top{background:#fff;border-bottom:1px solid var(--line)}
.acct-top .in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:30px;width:auto;display:block}
.brand span{font-weight:800;letter-spacing:.12em;font-size:13px;color:var(--gold-ink)}
.acct main{max-width:1080px;margin:0 auto;padding:28px 20px}
.acct h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.acct .crumbs{color:var(--muted);font-size:14px;margin:0 0 20px}
.subcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px;grid-template-columns:1fr auto;align-items:center;box-shadow:0 2px 10px rgba(20,22,40,.05)}
.subcard .nm{font-weight:700;font-size:17px}
.subcard .meta{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.off{background:#f2f3f5;color:var(--ink-soft)}
.linkbtn{background:none;border:0;padding:10px 4px;min-height:44px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.banner-f{margin-top:16px;border:1px solid var(--line-warm);background:linear-gradient(90deg,var(--gold-soft),#fff);border-radius:var(--radius);padding:18px 20px;display:grid;gap:12px;grid-template-columns:1fr auto;align-items:center}
.banner-f p{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;z-index:70;max-width:calc(100% - 32px)}
@media (max-width:600px){.subcard,.banner-f{grid-template-columns:1fr}}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:var(--proto-h) 0 0 0;z-index:40;background:rgba(20,22,29,.42);display:none;overflow:auto;padding:40px 16px}
.scrim.open{display:block}
.dlg{position:relative;margin:0 auto;width:100%;max-width:560px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.dlg.wide{max-width:600px}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0 24px}
.dlg-head .brand img{height:26px}
.dlg-head .brand span{font-size:12px}
.x{width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;display:grid;place-items:center;color:var(--ink-soft)}
.x:hover{background:#f3f4f6}
.dlg-body{padding:8px 32px 28px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);margin:10px 0 6px}
.dlg h2{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}
.lead{color:var(--ink-soft);margin:0 0 20px;font-size:16px}
.lead strong{color:var(--ink)}
@media (max-width:600px){
  .scrim{padding:0;background:var(--card)}
  .dlg,.dlg.wide{max-width:none;min-height:calc(100dvh - var(--proto-h));border-radius:0;box-shadow:none}
  .dlg-head{padding:10px 8px 0 16px}
  .dlg-body{padding:4px 16px 32px}
  .dlg h2{font-size:24px}
}

/* Botones: un primario por pantalla */
.actions{display:grid;gap:10px;margin-top:22px}
.actions.row{grid-template-columns:auto 1fr;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:40px;min-height:52px;padding:12px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;border:0;transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease}
.btn:active{transform:scale(.985)}
.btn-gold{background:var(--gold-pill);color:var(--ink);box-shadow:0 8px 20px rgba(201,162,39,.32),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-gold:hover{box-shadow:0 10px 26px rgba(201,162,39,.42),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-big{min-height:60px;font-size:18px;width:100%}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid #d6d9e0}
.btn-line:hover{border-color:var(--ink-soft)}
.btn[disabled]{cursor:not-allowed;background:#eceef2;color:#6b7280;box-shadow:none;border:0}
.btn .spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.decline{justify-self:center}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}

/* Banda de precio futuro: sutil, no tarjeta */
.band{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:10px 14px;background:var(--ivory);border-radius:12px;font-size:14px;color:var(--ink-soft)}
.band svg{flex:none;margin-top:2px;color:var(--gold-ink)}

/* Pantalla 1: lista vertical con icono de linea en circulo */
.vlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.vlist li{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);border:1px solid var(--line-warm);color:var(--gold-ink)}
.vlist h3{font-size:16px;margin:1px 0 2px}
.vlist p{margin:0;color:var(--ink-soft);font-size:14.5px}
.vlist a{font-weight:600;color:var(--ink);text-underline-offset:3px;padding:14px 0}

/* Pantalla 2: radios reales */
fieldset{border:0;margin:0;padding:0}
legend{padding:0}
.opts{display:grid;gap:10px}
.opt{position:relative;display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:#fff;transition:border-color .15s,background-color .15s}
.opt:hover{border-color:#cfd3db}
.opt input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:1px 0 0;border:2px solid #9aa0ab;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:#fff}
.opt input:checked{border-color:var(--ink)}
.opt input:checked::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.opt b{display:block;font-size:16px}
.opt>span>span{display:block;color:var(--muted);font-size:14px}
.help{margin:12px 2px 0;font-size:14px;color:var(--ink-soft);min-height:22px}
.help a{font-weight:600;color:var(--ink);text-underline-offset:3px;padding:14px 0}
.field{margin-top:18px}
.field label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field label span{font-weight:400;color:var(--muted)}
textarea{width:100%;min-height:88px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;font-size:16px}
textarea:focus-visible{border-color:var(--ink);outline:3px solid var(--ink);outline-offset:2px}

/* Pantalla 3: filas de reconocimiento, distintas de la 1 */
.notyet{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--green-soft);color:var(--green);font-size:14px;font-weight:600;margin:0 0 18px}
.acks{display:grid;gap:10px}
.ack{display:grid;grid-template-columns:24px 1fr;gap:14px;padding:16px;border-radius:14px;background:var(--ivory);border:1px solid var(--line-warm);cursor:pointer}
.ack input,.consent input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid #8f96a3;border-radius:7px;background:#fff;display:grid;place-items:center;cursor:pointer}
.ack input:checked,.consent input:checked{background:var(--ink);border-color:var(--ink)}
.ack input:checked::after,.consent input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ack b{display:block;font-size:16px}
.ack>span>span{display:block;color:var(--ink-soft);font-size:14.5px;margin-top:2px}

/* Pantalla 4: oferta tipo Ubersuggest */
.offer{border:1px solid var(--line-warm);border-radius:20px;padding:24px;background:linear-gradient(180deg,var(--gold-soft) 0%,#fff 46%)}
.offer-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line-warm);border-radius:999px;padding:5px 12px}
.timer.low{color:var(--red);border-color:#f3c4bf}
.prod{font-size:15px;font-weight:700;color:var(--gold-ink);margin:2px 0 0}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 0 2px}
.price .big{font-size:68px;line-height:1;font-weight:800;letter-spacing:-.035em}
.price s{color:var(--muted);font-size:20px}
.save{font-size:13px;font-weight:800;color:var(--gold-ink);background:#fff3cf;border-radius:999px;padding:3px 10px}
.once{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 18px}
.feat{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px}
.feat li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:15px;color:var(--ink-soft)}
.feat svg{color:var(--green);margin-top:3px}
.fine{font-size:13px;color:var(--muted);margin:14px 2px 0}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:4px 0 14px}
.swap div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.swap small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.swap b{display:block;font-size:15px;margin-top:2px}
.swap div>span{display:block;font-size:13.5px;color:var(--ink-soft)}
.swap .lost{color:var(--red);font-weight:600}
.swap .arr{border:0;padding:0;background:none;display:grid;place-items:center;color:var(--muted)}
.consent{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:14px;border-radius:14px;border:1.5px solid var(--line-warm);background:#fff;font-size:14.5px;color:var(--ink);cursor:pointer;margin:0 0 14px}
.consent:has(input:checked){border-color:var(--ink)}
.expired{border:1px dashed #cfd3db;border-radius:14px;padding:14px;text-align:center;color:var(--ink-soft);font-size:15px;margin-bottom:6px}
@media (max-width:600px){
  .offer{padding:18px}
  .price .big{font-size:60px}
  .swap{grid-template-columns:1fr 18px 1fr;gap:6px}
  .swap div{padding:10px}
  .swap b{font-size:14px;line-height:1.3}
  .swap div>span{font-size:12.5px;line-height:1.35}
  .swap small{font-size:10px}
  .consent{padding:12px;font-size:14px}
}

/* Pantalla 5: comparativa */
.done-strip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--green-soft);color:#14532d;font-size:14px;margin:4px 0 16px}
.done-strip svg{flex:none;color:var(--green);margin-top:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 16px}
.col{border-radius:16px;padding:16px 14px;border:1px solid var(--line)}
.col.pt{border:1.5px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),#fff 60%)}
.col h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.col.pt h3{color:var(--gold-ink)}
.col.std h3{color:var(--muted)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.col li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14.5px;line-height:1.35}
.col li svg{margin-top:1px}
.ok-i{color:var(--green)} .no-i{color:var(--red)} .neu-i{color:#9aa0ab}
.trial{text-align:center;padding:14px;border-radius:14px;background:var(--ivory);margin-bottom:12px}
.trial b{display:block;font-size:20px;letter-spacing:-.01em}
.trial>span{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:2px}
@media (max-width:380px){.col{padding:12px 10px}.col li{font-size:13.5px}}

/* Estados finales */
.res{text-align:center;padding-top:6px}
.res .big-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:8px auto 14px}
.big-ic.ok{background:var(--green-soft);color:var(--green)}
.big-ic.wait{background:var(--amber-soft);color:var(--amber)}
.big-ic.err{background:var(--red-soft);color:var(--red)}
.big-ic.info{background:var(--ivory-2);color:var(--gold-ink)}
.res .lead{margin-bottom:16px}
.facts{text-align:left;margin:0 0 4px;padding:6px 16px;border-radius:14px;background:var(--ivory)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-warm);font-size:14.5px}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--ink-soft)}
.facts dd{margin:0;font-weight:700;text-align:right}
.loading{display:grid;place-items:center;gap:14px;padding:48px 0 40px;text-align:center;color:var(--ink-soft)}
.loading .spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}

/* Simulador de checkout: NO es diseño, va rayado a proposito */
.sim{border:2px dashed #9aa0ab;border-radius:16px;padding:18px;background:repeating-linear-gradient(135deg,#fafafa 0 12px,#f2f3f5 12px 24px)}
.sim h3{margin:0 0 6px;font-size:15px}
.sim p{margin:0 0 12px;font-size:14px;color:var(--ink-soft)}
.sim .btns{display:grid;gap:8px}
.sim button{min-height:44px;border-radius:10px;border:1px solid #cfd3db;background:#fff;cursor:pointer;text-align:left;padding:8px 12px;font-size:14px}
.blocked{border:2px dashed var(--red);border-radius:16px;padding:18px;background:var(--red-soft);color:#7a1a12;font-size:14.5px}
.blocked b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}

/* Notas de contrato para Roberto (solo con «Notes» activado) */
.k,.trial .k,.swap .k,.facts .k{display:none!important}
body.notes .k{display:inline-block!important;font:600 10.5px/1.4 ui-monospace,Menlo,monospace;color:#6b4e00;background:#fff3cf;border:1px solid #e8c860;border-radius:6px;padding:0 5px;margin:0 4px;vertical-align:middle;letter-spacing:0;text-transform:none}

/* Modo captura: el dialogo crece con la pagina para que la captura completa lo saque entero */
body.cap .scrim{position:absolute;bottom:auto;min-height:calc(100% - 22px)}
body.cap{--proto-h:22px}
body.cap .vp{display:flex}
.vp{display:none;position:fixed;top:0;left:0;right:0;height:22px;align-items:center;justify-content:center;z-index:90;font:600 11px/1 -apple-system,sans-serif;background:#2b2e38;color:#fff;letter-spacing:.02em;pointer-events:none}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn,.opt{transition:none}.spin,.loading .spin{animation-duration:2.4s}}
</style>
</head>
<body>

<div class="proto" role="region" aria-label="Prototype controls">
  <b>PROTOTYPE</b><span class="sum" id="sum"></span>
  <button type="button" id="notesBtn" aria-pressed="false">Notes</button>
  <button type="button" id="drawerBtn" aria-expanded="false" aria-controls="drawer">Scenario</button>
</div>
<aside class="drawer" id="drawer" aria-label="Scenario">
  <h3>Fixture (ficticio)</h3>
  <label for="c-plan">Plan</label>
  <select id="c-plan"><option value="fg">Forex &amp; Gold VIP Monthly</option><option value="crypto">Crypto VIP Monthly</option><option value="am">All Markets VIP Monthly</option></select>
  <label for="c-status">Subscription status</label>
  <select id="c-status"><option value="active">Active, paid (eligible)</option><option value="on_hold">On Hold (out of scope)</option><option value="pending">Pending payment (out of scope)</option><option value="pending_cancel">Pending cancel (out of scope)</option><option value="other">Lifetime / Platinum / other (out of scope)</option></select>
  <label for="c-disc">Discount</label>
  <select id="c-disc"><option value="0">No discount</option><option value="1">Discounted price</option></select>
  <label for="c-ct">CopyTrading</label>
  <select id="c-ct"><option value="not_included">Not included (Monthly default)</option><option value="connected_vip">Connected, depends on VIP</option><option value="connected_own">Connected, independent of VIP</option><option value="unknown">Unknown (no backend flag)</option></select>
  <label for="c-extras">$99 offer = standard Lifetime extras</label>
  <select id="c-extras"><option value="unknown">Not confirmed (hide)</option><option value="yes">Confirmed (show)</option></select>
  <label for="c-ref">Reference price / % from backend</label>
  <select id="c-ref"><option value="1">Verified (show)</option><option value="0">Not verified (hide)</option></select>
  <label for="c-acks">Review rows</label>
  <select id="c-acks"><option value="0">Optional ticks (default)</option><option value="1">Required ticks (only if legal asks)</option></select>
  <label for="c-pt">Platinum trial</label>

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function ev(name, data){
  var line = name + (data ? ' ' + JSON.stringify(data) : '');
  logEl.textContent = line + '\n' + logEl.textContent;
}

/* Temporizador: lo controla el servidor. Aqui se simula guardando expires_at la PRIMERA vez
   que se ve la oferta (sessionStorage), asi que recargar no lo reinicia. */
var MEM={};
function offerExpiresAt(){
  var key='wx_offer_expires_'+S.plan, v=MEM[key]||null;
  try{ v = sessionStorage.getItem(key) || v; }catch(e){}
  if (!v){
    v = String(Date.now() + 15*60*1000); MEM[key]=v;
    try{ sessionStorage.setItem(key, v); }catch(e){}
    ev('offer_viewed',{offer:'lifetime_99', expires_at:new Date(+v).toISOString()});
  }
  return +v;
}
function remaining(){
  if (S.timer==='expired') return 0;
  if (S.timer==='low') return 47*1000;
  return Math.max(0, offerExpiresAt() - Date.now());
}
function mmss(ms){ var s=Math.ceil(ms/1000), m=Math.floor(s/60); s=s%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

  '<h2 id="dlgTitle" tabindex="-1">Current cancellation flow</h2>'+
  '<div class="sim"><h3>Out of scope, unchanged</h3><p>Status or product not eligible (On Hold, pending payment, pending cancel, Lifetime, Platinum, 7 Days, Small Caps, Account Management). The existing flow runs as today. On Hold pause terms are shown where the pause is managed, not here.</p></div>'+
  '<div class="actions"><button class="btn btn-line" data-act="close">Close</button></div>'; };

/* ===================== My Account de fondo ===================== */
function renderAcct(){
  var p=P(), b=document.getElementById('acctBody'), h='';
  if (S.acct==='lifetime'){
    h='<div class="subcard"><div><div class="nm">'+p.lifetime+'</div><div class="meta"><span class="pill ok">Active</span> One-time payment, no renewals</div></div></div>';
    if (S.plan==='am') h+='<div class="banner-f"><div><b>Crypto VIP Lifetime</b><p>Add Crypto Lifetime to keep Crypto VIP after '+fmt(PAID_THROUGH)+'.'+k('F: importe pendiente de aprobacion, no activar')+'</p></div><button class="btn btn-line" disabled>Price coming soon</button></div>';
  } else if (S.acct==='cancelled'){
    h='<div class="subcard"><div><div class="nm">'+p.monthly+'</div><div class="meta"><span class="pill off">Cancelled</span> VIP access until '+fmt(PAID_THROUGH)+'</div></div></div>';
  } else {
    h='<div class="subcard"><div><div class="nm">'+p.monthly+'</div><div class="meta"><span class="pill ok">Active</span> '+(S.disc?p.disc:p.price)+'/month. Renews '+fmt(PAID_THROUGH)+'</div></div><button class="linkbtn" data-act="open">Cancel subscription</button></div>';
  }
  b.innerHTML=h;
}

/* ===================== NAVEGACION ===================== */
var scrim=document.getElementById('scrim'), view=document.getElementById('view'), dlg=document.getElementById('dlg');
var lastFocus=null, tick=null, navId=0;
/* Las esperas simuladas solo actuan si nadie ha navegado (cerrar, Esc) mientras tanto */
function later(fn, ms){ var my=navId; setTimeout(function(){ if (my===navId) fn(); }, ms); }
function show(screen, opts){
  opts=opts||{}; navId++;
  if (!opts.noHist && S.screen && S.screen!=='account' && S.screen!==screen) S.hist.push(S.screen);
  if (screen!==S.screen) S.busy=false;
  S.screen=screen;
  if (screen==='account'){ scrim.classList.remove('open'); view.innerHTML=''; clearInterval(tick); renderAcct(); sync(); var op=document.querySelector('[data-act="open"]'); if(op) op.focus(); return; }
  if (!scrim.classList.contains('open')){ lastFocus=document.activeElement; scrim.classList.add('open'); }
  var html;
  if (screen==='loading-cancel') html=V.loading('Cancelling your renewal…');
  else if (screen==='loading-sync') html=V.Bsync();
  else html=(V[screen]||V.value)();
  view.innerHTML='<div class="fade">'+html+'</div>';
  dlg.classList.toggle('wide', screen==='offer'||screen==='platinum');
  scrim.scrollTop=0;
  document.getElementById('closeBtn').setAttribute('aria-label', S.done?'Close':'Close and keep my subscription');
  var t=view.querySelector('#dlgTitle'); if (t && !opts.keepFocus) t.focus({preventScroll:true});
  clearInterval(tick);
  if (screen==='offer' || screen==='C') tick=setInterval(updTimer, 1000);
  sync();
}
function updTimer(){
  var el=document.getElementById('tmr'); var ms=remaining();
  if (ms<=0 && S.screen==='C' && view.querySelector('[data-act="buy"]')){ ev('offer_expired'); rerender(); clearInterval(tick); return; }
  if (!el) return;
  if (ms<=0){ ev('offer_expired'); show(S.screen,{noHist:true,keepFocus:true}); clearInterval(tick); return; }
  el.textContent=mmss(ms);
}
function back(){ var prev=S.hist.pop(); show(prev||'value',{noHist:true}); }
function rerender(){ show(S.screen,{noHist:true,keepFocus:true}); }

function decline(){
  ev('offer_declined'); show('loading-cancel');
  later(function(){
    if (S.cancel==='error'){ ev('cancellation_failed'); show('cancelErr'); return; }
    ev('cancellation_confirmed',{paid_through:PAID_THROUGH}); S.acct='cancelled'; S.done=true;
    var pt=P().pt;
    if (S.reason==='poor' && S.pt==='eligible'){ ev('platinum_offer_viewed'); show('platinum'); }
    else show('A');
  }, 1100);
}

document.addEventListener('click', function(e){
  var a=e.target.closest('[data-act],[data-sim],[data-ev]'); if(!a) return;
  if (a.dataset.ev) ev(a.dataset.ev, a.dataset.ev==='help_link_clicked'?{reason:S.reason}:null);
  var act=a.dataset.act, sim=a.dataset.sim;
  if (act==='open'){
    ev('cancel_flow_opened',{plan:S.plan,status:S.status});
    show(S.status==='active'?'value':'out');
  }
  else if (act==='keep'){ ev('keep_clicked',{screen:S.screen}); S.hist=[]; show('account'); if(!S.done) toast('No changes made. Your subscription stays active.'); }
  else if (act==='close'){ ev('flow_closed',{screen:S.screen}); S.hist=[]; show('account'); }
  else if (act==='go') show(a.dataset.to);
  else if (act==='back') back();
  else if (act==='reasonNext'){ ev('reason_continue',{reason:S.reason}); show(S.reason==='price'?'offer':'review'); }
  else if (act==='buy'){
    if (S.busy) return;
    if (remaining()<=0){ rerender(); return; }
    ev('offer_accept_clicked'); S.busy=true; rerender();
    later(function(){ ev('checkout_opened',{product:P().lifetime,price:99}); show('checkout'); }, 900);
  }
  else if (act==='decline') decline();
  else if (act==='toA') show('A');
  else if (act==='trial'){ ev('platinum_trial_clicked'); show('trialCheckout'); }
  if ((sim==='paid'||sim==='3ds') && remaining()<=0){ ev('order_rejected_offer_expired'); S.hist.pop(); show('offer',{noHist:true}); }
  else if (sim==='paid'||sim==='3ds'){ ev(sim==='3ds'?'payment_3ds_passed':'payment_confirmed'); S.done=true; show('loading-sync'); later(function(){ ev('lifetime_entitlements_synced'); S.acct='lifetime'; show('B'); }, 1400); }
  else if (sim==='failed'){ ev('payment_failed'); show('C'); }
  else if (sim==='crypto'){ ev('payment_pending_crypto'); show('Cpending'); }
  else if (sim==='closed'){ ev('checkout_closed'); S.hist.pop(); show('offer',{noHist:true}); }
  else if (sim==='late'){ ev('order_rejected_offer_expired'); S.timer='expired'; show('offer',{noHist:true}); }
  else if (sim==='trial_ok'){ ev('platinum_trial_started'); show('D'); }
  else if (sim==='trial_fail'){ ev('platinum_trial_abandoned'); show('E'); }
});
document.addEventListener('change', function(e){
  var t=e.target;
  if (t.name==='reason'){
    S.reason=t.value; ev('reason_selected',{reason:S.reason});
    /* Sin re-pintar: se actualiza la linea de ayuda y se habilita Continue, el foco no se mueve */
    document.getElementById('help').innerHTML=helpLine();
    var nb=view.querySelector('[data-act="reasonNext"]'); nb.disabled=false; nb.removeAttribute('aria-describedby');
    var hn=document.getElementById('needR'); if(hn) hn.remove();
    sync();
  }
  else if (t.dataset.ack){ S.acks[t.dataset.ack]=t.checked; ev('review_ack',{row:t.dataset.ack,checked:t.checked}); if(S.reqAcks){ rerender(); var c=view.querySelector('[data-ack="'+t.dataset.ack+'"]'); if(c) c.focus(); } }
  else if (t.id==='amAck'){ S.amAck=t.checked; ev('am_change_acknowledged',{checked:t.checked}); rerender(); document.getElementById('amAck').focus(); }
  else if (t.id==='ptConsent'){ S.consent=t.checked; ev('platinum_consent',{checked:t.checked}); rerender(); document.getElementById('ptConsent').focus(); }
});
var cTimer=null;
document.addEventListener('input', function(e){
  if (e.target.id!=='comment') return;
  S.comment=e.target.value; clearTimeout(cTimer);
  cTimer=setTimeout(function(){ ev('reason_comment_saved',{chars:S.comment.length}); }, 700);
});
/* Escape = cerrar sin cambios; foco atrapado dentro del dialogo */
document.addEventListener('keydown', function(e){
  if (!scrim.classList.contains('open')) return;
  if (e.key==='Escape'){ ev('flow_closed',{screen:S.screen,via:'esc'}); S.hist=[]; show('account'); }
  if (e.key==='Tab'){
    var f=[].slice.call(dlg.querySelectorAll('a[href],button:not([disabled]),input,textarea,[tabindex="0"]'));
    if (!f.length) return; var first=f[0], last=f[f.length-1];
    if (e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
  }
});
document.getElementById('closeBtn').addEventListener('click', function(){ ev('flow_closed',{screen:S.screen,via:'x'}); S.hist=[]; var d=S.done; show('account'); if(!d) toast('No changes made. Your subscription stays active.'); });

function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();}, 3200); }

/* ===================== Controles del prototipo ===================== */
var CTRL={'c-plan':'plan','c-status':'status','c-disc':'disc','c-ct':'ct','c-extras':'extras','c-ref':'ref','c-acks':'reqAcks','c-pt':'pt','c-cancel':'cancel','c-timer':'timer'};
Object.keys(CTRL).forEach(function(id){
  var el=document.getElementById(id), key=CTRL[id];
  var v=S[key]; el.value = (typeof v==='boolean') ? (v?'1':'0') : v;
  el.addEventListener('change', function(){
    S[key] = (key==='disc'||key==='ref'||key==='reqAcks') ? el.value==='1' : el.value;
    if (key==='timer' && el.value==='fresh'){ try{ sessionStorage.removeItem('wx_offer_expires_'+S.plan); }catch(e){} }
    if (S.screen==='account') renderAcct(); else rerender();
  });
});
var JUMPS=[['account','My Account'],['value','1 Value'],['reason','2 Reason'],['review','3 Review'],['offer','4 Offer $99'],['checkout','Checkout sim'],['platinum','5 Platinum'],['A','A Cancelled'],['loading-sync','B Activating'],['B','B Lifetime'],['C','C Failed'],['Cpending','C Crypto pending'],['D','D Trial active'],['E','E No trial'],['cancelErr','Cancel error'],['out','Out of scope']];
document.getElementById('jump').innerHTML=JUMPS.map(function(j){return '<button type="button" data-jump="'+j[0]+'">'+j[1]+'</button>';}).join('');
document.getElementById('jump').addEventListener('click', function(e){ var b=e.target.closest('[data-jump]'); if(!b) return; S.hist=[]; show(b.dataset.jump,{noHist:true}); });
var drawer=document.getElementById('drawer'), dBtn=document.getElementById('drawerBtn');
dBtn.addEventListener('click', function(){ var o=drawer.classList.toggle('open'); dBtn.setAttribute('aria-expanded',o); });
var nBtn=document.getElementById('notesBtn');
nBtn.setAttribute('aria-pressed', document.body.classList.contains('notes'));
nBtn.addEventListener('click', function(){ var o=document.body.classList.toggle('notes'); nBtn.setAttribute('aria-pressed',o); });
function sync(){
  var r=REASONS.filter(function(x){return x.id===S.reason;})[0];
  document.getElementById('sum').textContent = P().monthly+' | '+(r?r.t:'no reason')+' | screen: '+S.screen;
  var u=new URLSearchParams(location.search); u.set('s',S.screen); u.set('plan',S.plan); if(S.reason) u.set('reason',S.reason);
  history.replaceState(null,'','?'+u.toString());
}

/* Arranque: ?s=<pantalla> abre directamente esa vista (lo usan las capturas) */
renderAcct();
if (S.screen && S.screen!=='account') show(S.screen,{noHist:true}); else sync();
</script>
